<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--bg:#ffffff;--fg:#1f1f1f;--muted:#6b6b6b;--rule:#e6e6e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171717;--fg:#e9e9e9;--muted:#9b9b9b;--rule:#2f2f2f}}
:root[data-theme="dark"]{--bg:#171717;--fg:#e9e9e9;--muted:#9b9b9b;--rule:#2f2f2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px 72px}
h1{font-size:28px;line-height:1.25;font-weight:650;margin:0 0 6px}
.by{color:var(--muted);font-size:14px;margin:0 0 28px}
.lead{font-size:19px;margin:0 0 8px}
.lead p{margin:0 0 8px}
h2{font-size:17px;font-weight:650;margin:32px 0 6px}
p,ul,ol{margin:0 0 12px}
ul,ol{padding-left:22px}
li{margin:4px 0}
a{color:inherit;text-underline-offset:2px}
details{margin-top:44px;border-top:1px solid var(--rule);padding-top:14px;color:var(--muted);font-size:15px}
summary{cursor:pointer}
details h2{font-size:15px}
code,pre{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 12px;padding:8px 12px;border:1px solid var(--rule);border-radius:6px}
li p{margin:4px 0}
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<p class="by">{{byline}}</p>
{{body}}
</main>
</body>
</html>
