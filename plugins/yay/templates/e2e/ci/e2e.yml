name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
#if-pnpm
      - uses: pnpm/action-setup@v4
#end-pnpm
      - uses: actions/setup-node@v4
        with:
          {{e2e.node}}
      - name: Build the plugin
        run: {{e2e.prepare}}
      - name: Install the e2e tools
        working-directory: {{e2e.dir}}
        run: {{e2e.ciInstall}} && npx playwright install --with-deps chromium
      - name: Start WordPress
        working-directory: {{e2e.dir}}
        run: npx wp-env start
      - name: Run the specs
        working-directory: {{e2e.dir}}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            {{e2e.dir}}/playwright-report
            {{e2e.dir}}/test-results
          retention-days: 7
